  このファイルのHTML構造、UI設計、または数式スライダーを変更した場合は、`README.md` もあわせて更新してください。

<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業分析ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#182235',
              dark: '#243044',
              blue: '#3b82f6',
              emerald: '#10b981',
              purple: '#8b5cf6',
              cyan: '#06b6d4',
              amber: '#f59e0b',
            }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css?v=2.5.2">
</head>
<body class="h-full bg-brand-navy text-slate-100 flex overflow-hidden">

  <div class="neon-glow-1"></div>
  <div class="neon-glow-2"></div>
  <div class="neon-glow-3"></div>

  <aside id="sidebar" class="w-64 glass-panel border-r border-slate-800 flex flex-col z-20 flex-shrink-0">
    <div class="p-6 border-b border-slate-800/60">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-blue to-brand-cyan flex items-center justify-center shadow-lg shadow-brand-blue/20">
          <i data-lucide="git-branch" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-wider text-white">SALES ANALYTICS</h1>
          <p class="text-[10px] text-slate-400 font-medium tracking-tight">営業分析ダッシュボード</p>
        </div>
      </div>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1.5 overflow-y-auto">
      <label class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold px-3 mb-2 block">分析ページ</label>
      <button onclick="switchTab('overview')" id="tab-btn-overview" class="sidebar-link active flex items-center gap-3 w-full px-4 py-2.5 text-xs font-semibold rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/40">
        <i data-lucide="git-branch" class="w-4 h-4"></i>
        <span>ファネル分析</span>
      </button>
      <button onclick="switchTab('cross')" id="tab-btn-cross" class="sidebar-link flex items-center gap-3 w-full px-4 py-2.5 text-xs font-semibold rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/40">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
        <span>クロス集計</span>
      </button>
    </nav>

    <div class="p-4 border-t border-slate-800/60 bg-slate-900/40 flex-shrink-0">
      <p class="text-[10px] text-slate-500 leading-relaxed">プロセスの分析とクロス集計を確認します。</p>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0 overflow-hidden relative z-10">
    <header class="h-12 glass-panel border-b border-slate-800 flex items-center justify-between px-5 z-10 flex-shrink-0">
      <div class="flex items-center gap-3">
        <button id="sidebarToggle" class="p-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 hover:bg-slate-700/60 text-slate-300 hover:text-white transition flex items-center justify-center cursor-pointer" title="サイドバーの開閉">
          <i data-lucide="panel-left-close" class="w-4.5 h-4.5"></i>
        </button>
        <div>
          <div class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Sales View</div>
          <h2 id="currentTabTitle" class="text-sm font-bold text-white tracking-tight">ファネル分析</h2>
        </div>
      </div>
    </header>

    <div id="mainScrollArea" class="flex-1 overflow-y-auto overflow-x-hidden w-full px-3 pt-4 pb-3 relative">
      <div id="tab-content-overview" class="tab-content">
        <div id="funnel-layer-overall" class="funnel-layer-content hidden">
          <section class="grid grid-cols-1 xl:grid-cols-5 gap-6">
          <div class="xl:col-span-3 glass-panel rounded-2xl p-6">
            <div class="flex items-start justify-between gap-4 mb-6">
              <div>
                <h3 class="text-base font-bold text-white">全体ファネル分析</h3>
                <p class="text-[10px] text-slate-400 mt-0.5">全チームを合算し、登録から決定までのボトルネックを確認します。</p>
              </div>
              <span class="px-2 py-0.5 rounded-full bg-brand-blue/10 border border-brand-blue/20 text-brand-cyan text-[9px] font-bold">全体</span>
            </div>
            <div class="flex items-center justify-between mb-3 text-[10px] px-1">
              <span class="text-slate-500 font-medium">※ バー内の縦点線: 目標ベンチマーク (対登録比)</span>
              <span class="text-brand-emerald font-bold">緑字: 目標値</span>
            </div>
            <div id="overviewFunnelStepsContainer" class="space-y-3.5 pr-2"></div>
            <div id="overviewFunnelBottleneckContainer"></div>
          </div>

          <div class="xl:col-span-2 glass-panel rounded-2xl p-6">
            <div class="mb-5">
              <h3 class="text-base font-bold text-white">配下ファネル概要</h3>
              <p class="text-[10px] text-slate-400 mt-0.5">各チームのファネルを一覧で比較します。</p>
            </div>
            <div id="teamFunnelSummaryGrid" class="space-y-3"></div>
          </div>
          </section>
        </div>

        <div id="funnel-layer-team" class="funnel-layer-content hidden">
          <div class="glass-panel rounded-2xl p-2.5">
            <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-2 mb-2">
              <div class="flex flex-col sm:flex-row sm:items-start gap-2 min-w-0">
                <button data-comparison-show-all="true" class="px-3 py-1 rounded-lg bg-slate-800/80 border border-slate-700/70 text-[10px] font-bold text-slate-300 hover:text-white hover:border-brand-blue/35 transition">
                  全項目表示
                </button>
                <div id="teamComparisonVisibilityControls" class="flex flex-wrap justify-start gap-1.5"></div>
              </div>
              <div class="inline-flex justify-end text-[10px] font-bold lg:ml-4 flex-shrink-0 rounded-md overflow-hidden border border-slate-700/80">
                <button data-comparison-mode="team" id="comparison-mode-team" class="comparison-mode-btn px-3 py-1 bg-slate-800/80 text-white border-r border-slate-700/80">チーム</button>
                <button data-comparison-mode="member" id="comparison-mode-member" class="comparison-mode-btn px-3 py-1 bg-slate-950/40 text-slate-400 hover:text-white hover:bg-slate-800/70 border-r border-slate-700/80">個人</button>
                <button data-comparison-mode="area" id="comparison-mode-area" class="comparison-mode-btn px-3 py-1 bg-slate-950/40 text-slate-400 hover:text-white hover:bg-slate-800/70 border-r border-slate-700/80">エリア</button>
                <button data-comparison-mode="prefecture" id="comparison-mode-prefecture" class="comparison-mode-btn px-3 py-1 bg-slate-950/40 text-slate-400 hover:text-white hover:bg-slate-800/70 border-r border-slate-700/80">都道府県</button>
                <button data-comparison-mode="age" id="comparison-mode-age" class="comparison-mode-btn px-3 py-1 bg-slate-950/40 text-slate-400 hover:text-white hover:bg-slate-800/70">年齢</button>
              </div>
            </div>
            <div id="teamFunnelComparisonMatrix" class="team-funnel-compare-scroll overflow-x-auto pb-1"></div>
          </div>
        </div>

      </div>


      <div id="tab-content-cross" class="tab-content hidden w-full">
        <!-- メインマトリクス & 選択セグメント詳細のグリッド -->
        <div class="grid grid-cols-1 xl:grid-cols-5 gap-4 items-start">
          <!-- 左側 (Col-span-3): 軸設定 & 複数指標テーブル群 -->
          <div id="crossLeftPane" class="xl:col-span-3 space-y-3">
            <!-- クロス集計 ヘッダー (軸設定) -->
            <div class="glass-panel glass-panel-static rounded-xl p-3 border border-slate-800/80 flex flex-col md:flex-row md:items-center justify-between gap-3">
              <div class="flex items-center gap-3 text-xs font-bold text-white">
                <div class="flex items-center gap-1.5">
                  <span class="text-slate-400 text-[10px] font-bold uppercase tracking-wider">横軸（行）：</span>
                  <select id="crossRowSelector" onchange="onCrossAxisChange()" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs font-extrabold text-white focus:outline-none focus:border-brand-blue cursor-pointer">
                    <option value="area" selected>エリア (地域)</option>
                    <option value="ageGroup">年齢グループ</option>
                    <option value="jobType">求人職種</option>
                    <option value="contractType">契約区分</option>
                  </select>
                </div>
                
                <span class="text-slate-500 font-medium">×</span>
                
                <div class="flex items-center gap-1.5">
                  <span class="text-slate-400 text-[10px] font-bold uppercase tracking-wider">縦軸（列）：</span>
                  <select id="crossColSelector" onchange="onCrossAxisChange()" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs font-extrabold text-white focus:outline-none focus:border-brand-blue cursor-pointer">
                    <option value="area">エリア (地域)</option>
                    <option value="ageGroup" selected>年齢グループ</option>
                    <option value="jobType">求人職種</option>
                    <option value="contractType">契約区分</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- 複数テーブルがここに描画される -->
            <div id="crossTablesContainer" class="space-y-3"></div>

            <!-- 新規テーブル追加用の破線ボタン -->
            <button onclick="addCrossTable()" class="w-full py-2.5 border border-dashed border-slate-800 hover:border-brand-blue/50 rounded-xl bg-slate-950/20 hover:bg-slate-950/45 text-slate-400 hover:text-white text-xs font-bold transition flex items-center justify-center gap-2 group cursor-pointer">
              <i data-lucide="plus" class="w-4 h-4 text-slate-500 group-hover:text-brand-cyan transition-transform group-hover:rotate-90"></i>
              <span>集計テーブルを追加する</span>
            </button>
          </div>

          <!-- 右側 (Col-span-2): セグメント詳細 -->
          <div class="xl:col-span-2 glass-panel rounded-2xl p-6 self-stretch" id="crossSegmentDetailContainer">
            <!-- JSで動的描画 -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="jpmap.min.js?v=2.5.1"></script>
  <script src="data.js?v=2.5.2"></script>
  <script src="app.js?v=2.5.28"></script>
</body>
</html>
